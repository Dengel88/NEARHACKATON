<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merchant Desk</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14161a;--muted:#5d6470;--line:#e3e6eb;--accent:#00c08b;--accent-ink:#04261c;--bot:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--panel:#16191e;--ink:#e9ecf1;--muted:#98a0ad;--line:#262b33;--bot:#1f242b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bot);color:var(--muted)}
.badge.PAID{background:#d8f5e9;color:#0b6b48}.badge.AWAITING_PAYMENT,.badge.PROCESSING{background:#fff3d6;color:#7a4d00}
.badge.FAILED,.badge.REFUNDED,.badge.EXPIRED{background:#fde2e2;color:#9b1c1c}
.h{border:1px solid #f0c36d;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.h small{color:var(--muted)}
.convo{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.m{padding:6px 10px;border-radius:10px;background:var(--bot);max-width:90%;white-space:pre-wrap}
.m.user{align-self:flex-end;background:var(--ink);color:var(--bg)}.m.manager{border:1px solid #f0c36d}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font:inherit}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.empty{color:var(--muted)}
code{font-size:12px}
</style>
</head>
<body>
<main>
  <h1 id="title">Merchant desk</h1>
  <div class="sub" id="sub"></div>
  <div class="stats">
    <div class="stat"><b id="s-inv">0</b><span>Invoices issued</span></div>
    <div class="stat"><b id="s-paid">0</b><span>Paid</span></div>
    <div class="stat"><b id="s-rev">$0</b><span>Received, USDC on NEAR</span></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Invoices</h2><table><thead><tr><th>Invoice</th><th>Items</th><th>Total</th><th>Paid with</th><th>Status</th></tr></thead><tbody id="inv"></tbody></table></div>
    <div>
      <div class="card"><h2>Waiting for a manager</h2><div id="handoffs"></div></div>
      <div class="card" id="session" style="margin-top:16px;display:none">
        <h2>Conversation <code id="sid"></code></h2>
        <div class="convo" id="convo"></div>
        <textarea id="reply" rows="2" placeholder="Reply as the manager…"></textarea>
        <div class="row"><button id="send">Send</button><button class="ghost" id="release">Hand back to AI</button></div>
      </div>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const token = new URLSearchParams(location.search).get("token") || "";
const q = p => p + (p.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current = null;

async function api(p, o = {}) { const r = await fetch(q(p), {headers: {"Content-Type": "application/json"}, ...o}); const d = await r.json(); if (!r.ok) throw new Error(d.detail); return d; }

async function load() {
  const d = await api("/api/merchant/overview");
  $("#title").textContent = d.merchant.name + " · merchant desk";
  $("#sub").innerHTML = `Payments settle to <code>${esc(d.settles_to)}</code> as USDC on NEAR, via NEAR Intents.`;
  $("#s-inv").textContent = d.stats.invoices; $("#s-paid").textContent = d.stats.paid; $("#s-rev").textContent = "$" + d.stats.revenue_usd;
  $("#inv").innerHTML = d.invoices.map(i => `<tr>
    <td><code>${esc(i.id)}</code></td><td>${esc(i.lines.map(l => l.name + " ×" + l.qty).join(", "))}</td><td>$${esc(i.total_usd)}</td>
    <td>${i.payment ? esc(i.payment.amount_in_formatted + " " + i.payment.origin_symbol + " (" + i.payment.origin_chain + ")") : "—"}</td>
    <td><span class="badge ${i.status}">${esc(i.status)}</span></td></tr>`).join("") || '<tr><td colspan="5" class="empty">No invoices yet.</td></tr>';
  $("#handoffs").innerHTML = d.handoffs.map(h => `<div class="h" data-sid="${esc(h.session_id)}"><b>${esc(h.reason)}</b><br><small>${esc(h.contact || "no contact")} · ${new Date(h.created_at * 1000).toLocaleString()}</small></div>`).join("") || '<div class="empty">Nobody is waiting.</div>';
  document.querySelectorAll(".h").forEach(el => el.onclick = () => open(el.dataset.sid));
  if (current) open(current, true);
}

async function open(sid, quiet) {
  current = sid; $("#session").style.display = ""; $("#sid").textContent = sid;
  const d = await api(`/api/merchant/sessions/${sid}`);
  $("#convo").innerHTML = d.messages.map(m => `<div class="m ${m.role}">${esc(m.content)}</div>`).join("");
  if (!quiet) $("#convo").scrollTop = 1e9;
}

$("#send").onclick = async () => { const t = $("#reply").value.trim(); if (!t || !current) return; await api(`/api/merchant/sessions/${current}/reply`, {method: "POST", body: JSON.stringify({text: t})}); $("#reply").value = ""; load(); };
$("#release").onclick = async () => { if (!current) return; await api(`/api/merchant/sessions/${current}/reply`, {method: "POST", body: JSON.stringify({release: true})}); current = null; $("#session").style.display = "none"; load(); };
load().catch(e => $("#sub").textContent = e.message); setInterval(() => load().catch(() => {}), 5000);
</script>
</body>
</html>
